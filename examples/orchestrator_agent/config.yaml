# SGR Agent Core - Orchestrator Agent
# Decomposes user requests and routes them to specialized agents:
#   - time_agent: for time-related questions
#   - joke_agent: for jokes and humor
# Connected to other agents via MCP gateway.
# Deployed on mcp-network, backend port 8030, MCP server port 8031

llm:
  api_key: "sk-proj-gM0CAkd1FhTTdO7CUMM8T3BlbkFJ6FxVEpiXYU3wepgi30ZX"
  base_url: "https://api.openai.com/v1"
  model: "gpt-4o-mini"
  max_tokens: 8000
  temperature: 0.3

execution:
  max_clarifications: 3
  max_iterations: 15
  mcp_context_limit: 15000
  logs_dir: "logs"
  reports_dir: "reports"

mcp_server:
  enabled: true
  host: "0.0.0.0"
  port: 8031
  transport: "sse"
  default_agent: null
  tool_name: "orchestrator_agent"
  tool_description: "Use this tool to process complex requests that may require time lookups or humorous responses"

# MCP Client: Connect to agents via MCP Gateway
# Replace the URLs with your MCP Gateway virtual server endpoints
mcp:
  mcpServers:
    multi_agents:
      url: "http://host.docker.internal:4444/servers/02dc90b1923b4dd89116bf13b763bea1/sse"
      headers:
        Authorization: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..5RJDw-jnTBZd1i473nSvjleBkpdWgMgDizBzNkTdT4Q"

    
